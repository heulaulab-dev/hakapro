name: CI

on:
  push:
    branches: [develop, staging, main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - name: Engine integration tests (throwaway PostgreSQL)
        run: bun run engine:test:e2e
      - name: Production guards refuse unsafe configuration
        run: bun run check:prod-guards
      - name: server-only boundary
        run: bun run check:server-boundary
      - name: Production build (placeholder config, not deployable)
        run: bun run build:check
      - name: E2E (fixture data, dev auth bypass)
        run: |
          bunx playwright install --with-deps chromium
          bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
